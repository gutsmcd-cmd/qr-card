<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mat McDaniel · matsapphouse</title>
<meta name="description" content="Digital business card + Sound of Space lo-fi radio">
<meta name="theme-color" content="#FF69B4">
<script>
/* ================================================================
   EDIT ME: this CONFIG block is the only thing you need to change
   to make your own card. Everything below it reads from here.
   Fields marked PLACEHOLDER still need real values.
   ================================================================ */
const CONFIG = {
  name:        "Mat McDaniel",
  nameJa:      "マット・マクダニエル",
  handle:      "matsapphouse",
  org:         "Mat's App House",
  title:       { en: "Creator · songs, videos, art, games & apps", ja: "クリエイター・音楽／動画／アート／ゲーム／アプリ" },
  tagline:     { en: "Science, space & amazing animals, made in Osaka in pink & green.",
                 ja: "科学・宇宙・ふしぎな動物。大阪からピンク＆グリーンでお届け。" },
  location:    { en: "Osaka, Japan", ja: "大阪" },
  phone:       "+81-00-0000-0000",          // PLACEHOLDER: replace with a real number, or set to "" to hide
  email:       "you@example.com",           // PLACEHOLDER: replace with a real email, or set to "" to hide
  website:     "https://app-house.grok.me", // Mat's App House
  links: [                                  // PLACEHOLDER URLs: swap "#" for real profile links; delete lines you don't need
    { label: "App House",  url: "https://app-house.grok.me" },
    { label: "YouTube",    url: "#" },      // e.g. https://www.youtube.com/@matsapphouse
    { label: "X",          url: "#" },      // e.g. https://x.com/matsapphouse
    { label: "Instagram",  url: "#" },
    { label: "TikTok",     url: "#" },
    { label: "SoundCloud", url: "#" },
    { label: "Bluesky",    url: "#" }
  ],
  shopUrl:     "#",                         // PLACEHOLDER: "Get the shirt" link (SUZURI / UP-T / Printful shop)
  track: {
    src:     "space-lofi-loop.mp3",         // the looping track, next to this file
    seconds: 202.10526,                     // exact loop length (64 bars @ 76 BPM), used for gapless looping
    title:   "Sound of Space · lo-fi radio",
    credit:  { en: "Contains public-domain NASA audio (Cassini & Voyager). Not endorsed by NASA.",
               ja: "NASAのパブリックドメイン音源（カッシーニ・ボイジャー）を使用。NASAの公認ではありません。" }
  },
  colors: { pink: "#FF69B4", lightPink: "#FFC0DA", green: "#2EB478", lightGreen: "#AAEBBE", ink: "#1b1726" },
  defaultLang: "auto"                       // "en", "ja", or "auto" (follows the phone's language)
};
</script>
<style>
:root{--pink:#FF69B4;--lpink:#FFC0DA;--green:#2EB478;--lgreen:#AAEBBE;--ink:#1b1726}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 10% -10%,var(--lpink),transparent 60%),radial-gradient(900px 700px at 110% 20%,var(--lgreen),transparent 60%),#fff7fb;
  padding:max(16px,env(safe-area-inset-top)) 16px 40px;line-height:1.45}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pink)}
.lang{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 8px #0001}
.lang button{border:0;background:none;padding:7px 12px;border-radius:999px;font:inherit;font-weight:700;color:#777;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--green);color:#fff}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 30px #ff69b422;overflow:hidden}
.band{height:12px;background:linear-gradient(90deg,var(--green),var(--pink))}
.inner{padding:20px}
.who{display:flex;gap:14px;align-items:center}
.avatar{flex:0 0 72px;height:72px;border-radius:50%;background:var(--lpink);border:5px solid var(--green);display:grid;place-items:center}
h1{font-size:1.45rem;line-height:1.2}
.ja-name{color:#666;font-size:.95rem}
.title{color:var(--green);font-weight:700;font-size:.9rem;margin-top:2px}
.tag{margin:14px 0 6px;color:#444}
.loc{font-size:.85rem;color:#888}
.contact{display:grid;gap:8px;margin-top:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#faf6f9;text-decoration:none;color:inherit;font-size:.95rem;word-break:break-all}
.row b{min-width:58px;color:var(--pink);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.ph{font-size:.7rem;background:#ffe9a8;color:#7a5b00;border-radius:6px;padding:1px 6px;margin-left:auto;white-space:nowrap}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;text-decoration:none}
.save{background:var(--green);color:#fff;margin-top:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{padding:8px 13px;border-radius:999px;border:2px solid var(--lpink);text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem}
.links a.todo{border-style:dashed;color:#999}
.radio{background:#14183a;color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.radio h2{font-size:1.15rem}.radio p{color:var(--lgreen);font-size:.85rem}
canvas{display:block;width:100%;height:120px;margin:12px 0}
.tune{background:var(--pink);color:#fff;font-size:1.35rem;padding:20px;box-shadow:0 6px 0 #c94a8c}
.tune:active{transform:translateY(3px);box-shadow:0 3px 0 #c94a8c}
.tune.on{background:var(--green);box-shadow:0 6px 0 #1d7a50}
.vol{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:.8rem;color:#ccd}
.vol input{flex:1;accent-color:var(--pink)}
.credit{font-size:.72rem;color:#aab;margin-top:10px}
.shop{background:#fff;color:var(--pink);border:3px solid var(--pink)}
footer{text-align:center;font-size:.75rem;color:#999}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#FFC0DA" stroke="#2EB478" stroke-width="8"/><path d="M20 50 50 22 80 50Z" fill="#FF69B4"/><rect x="30" y="48" width="40" height="32" fill="#2EB478"/><text x="50" y="74" font-size="26" font-weight="900" fill="#fff" text-anchor="middle" font-family="sans-serif">M</text></svg><span id="handle"></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="b-en" data-l="en">EN</button><button id="b-ja" data-l="ja">日本語</button>
    </div>
  </div>

  <section class="card" aria-label="Business card">
    <div class="band"></div>
    <div class="inner">
      <div class="who">
        <div class="avatar"><svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true"><path d="M8 52 50 14 92 52Z" fill="#FF69B4"/><rect x="22" y="48" width="56" height="44" fill="#2EB478"/><text x="50" y="84" font-size="36" font-weight="900" fill="#fff" text-anchor="middle" font-family="sans-serif">M</text></svg></div>
        <div><h1 id="name"></h1><div class="ja-name" id="nameJa"></div><div class="title" id="title"></div></div>
      </div>
      <p class="tag" id="tagline"></p>
      <div class="loc" id="loc"></div>
      <div class="contact" id="contact"></div>
      <button class="btn save" id="save"></button>
      <div class="links" id="links"></div>
    </div>
  </section>

  <section class="radio" aria-label="Sound of Space radio">
    <h2 id="r-title"></h2><p id="r-sub"></p>
    <canvas id="viz" width="900" height="240" aria-hidden="true"></canvas>
    <button class="btn tune" id="tune"></button>
    <div class="vol"><span id="vol-l"></span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
    <div class="credit" id="credit"></div>
  </section>

  <a class="btn shop" id="shop" target="_blank" rel="noopener"></a>
  <footer id="foot"></footer>
</div>
<audio id="fallback" preload="none" loop playsinline></audio>
<script>
const T={
 en:{save:"＋ Save contact",tune:"▶  Tune in",stop:"❚❚  Pause",rTitle:"Sound of Space",rSub:"Nonstop chill lo-fi, built from real space recordings",
     vol:"Volume",shop:"👕 Get the shirt",soon:"(shop link coming soon)",ph:"placeholder",phone:"Phone",email:"Email",web:"Web",
     foot:"Scanned my shirt? Nice to meet you!",loading:"Loading…"},
 ja:{save:"＋ 連絡先を保存",tune:"▶  聴いてみる",stop:"❚❚  一時停止",rTitle:"宇宙の音ラジオ",rSub:"本物の宇宙の音から作った、ノンストップのチルなLo-Fi",
     vol:"音量",shop:"👕 このシャツを手に入れる",soon:"（ショップは準備中）",ph:"仮",phone:"電話",email:"メール",web:"Web",
     foot:"シャツをスキャンしてくれてありがとう！よろしくお願いします。",loading:"読み込み中…"}
};
const C=CONFIG, $=id=>document.getElementById(id);
const isPH=v=>!v||v==="#"||/example\.com|0000-0000/.test(v);
let lang=C.defaultLang==="auto"?((navigator.language||"en").startsWith("ja")?"ja":"en"):C.defaultLang;
for(const [k,v] of Object.entries(C.colors)) document.documentElement.style.setProperty({pink:"--pink",lightPink:"--lpink",green:"--green",lightGreen:"--lgreen",ink:"--ink"}[k],v);

function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  $("b-en").setAttribute("aria-pressed",lang==="en"); $("b-ja").setAttribute("aria-pressed",lang==="ja");
  $("handle").textContent=C.handle; $("name").textContent=lang==="ja"?C.nameJa:C.name; $("nameJa").textContent=lang==="ja"?C.name:C.nameJa;
  $("title").textContent=C.title[lang]; $("tagline").textContent=C.tagline[lang]; $("loc").textContent="📍 "+C.location[lang];
  const rows=[]; const row=(lab,val,href)=>`<a class="row" ${isPH(val)?"":`href="${href}"`}><b>${lab}</b><span>${val}</span>${isPH(val)?`<span class="ph">${t.ph}</span>`:""}</a>`;
  if(C.phone) rows.push(row(t.phone,C.phone,"tel:"+C.phone.replace(/[^+\d]/g,"")));
  if(C.email) rows.push(row(t.email,C.email,"mailto:"+C.email));
  if(C.website) rows.push(row(t.web,C.website.replace(/^https?:\/\//,""),C.website).replace('<a class="row" ','<a class="row" target="_blank" rel="noopener" '));
  $("contact").innerHTML=rows.join("");
  $("links").innerHTML=C.links.map(l=>`<a href="${l.url}" ${isPH(l.url)?'class="todo" title="'+t.ph+'"':'target="_blank" rel="noopener"'}>${l.label}</a>`).join("");
  $("save").textContent=t.save; $("r-title").textContent=t.rTitle; $("r-sub").textContent=t.rSub; $("vol-l").textContent=t.vol;
  $("tune").textContent=playing?t.stop:t.tune; $("credit").textContent=C.track.title+" — "+C.track.credit[lang];
  const shop=$("shop"); shop.textContent=t.shop+(isPH(C.shopUrl)?" "+t.soon:""); shop.href=C.shopUrl;
  $("foot").textContent=t.foot;
}
$("b-en").onclick=()=>{lang="en";render()}; $("b-ja").onclick=()=>{lang="ja";render()};

/* ---- vCard (.vcf) ---- */
$("save").onclick=()=>{
  const esc=s=>String(s).replace(/([,;\\])/g,"\\$1");
  const L=["BEGIN:VCARD","VERSION:3.0",`N:${esc(C.name.split(" ").slice(-1)[0])};${esc(C.name.split(" ").slice(0,-1).join(" "))};;;`,`FN:${esc(C.name)}`,
    `NICKNAME:${esc(C.handle)}`,`ORG:${esc(C.org)}`,`TITLE:${esc(C.title.en)}`,`NOTE:${esc(C.tagline.en+" / "+C.tagline.ja)}`,`ADR;TYPE=WORK:;;;${esc(C.location.en.split(",")[0])};;;${esc((C.location.en.split(",")[1]||"").trim())}`];
  if(C.phone&&!isPH(C.phone)) L.push("TEL;TYPE=CELL:"+C.phone);
  if(C.email&&!isPH(C.email)) L.push("EMAIL;TYPE=INTERNET:"+C.email);
  if(C.website) L.push("URL:"+C.website);
  C.links.filter(l=>!isPH(l.url)&&l.url!==C.website).forEach(l=>L.push(`X-SOCIALPROFILE;TYPE=${esc(l.label.toLowerCase())}:${l.url}`));
  L.push("END:VCARD");
  const blob=new Blob([L.join("\r\n")+"\r\n"],{type:"text/vcard;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(C.handle||"contact")+".vcf"; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
};

/* ---- Player: Web Audio gapless loop, with <audio loop> fallback (e.g. when opened from file://) ---- */
let ctx,gain,analyser,buf,src,playing=false,useFallback=false; const fb=$("fallback");
async function start(){
  const t=T[lang];
  if(!useFallback){
    try{
      if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)(); gain=ctx.createGain(); analyser=ctx.createAnalyser(); analyser.fftSize=256; gain.connect(analyser); analyser.connect(ctx.destination);}
      await ctx.resume();
      if(!buf){$("tune").textContent=t.loading; const r=await fetch(C.track.src); if(!r.ok) throw 0; buf=await ctx.decodeAudioData(await r.arrayBuffer());}
      src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      // If the browser didn't trim the MP3 encoder delay, skip it so the loop seam stays seamless.
      const extra=buf.duration-C.track.seconds; const ls=extra>0.01?Math.min(1105/44100,extra):0;
      src.loopStart=ls; src.loopEnd=ls+Math.min(C.track.seconds,buf.duration-ls);
      gain.gain.value=+$("vol").value; src.connect(gain); src.start(0,ls); playing=true; render(); return;
    }catch(e){useFallback=true}
  }
  fb.src=C.track.src; fb.volume=+$("vol").value; await fb.play(); playing=true; render();
}
function stop(){ if(src){try{src.stop()}catch(e){} src=null} fb.pause(); playing=false; render(); }
$("tune").onclick=()=>playing?stop():start();
$("vol").oninput=e=>{ if(gain) gain.gain.value=+e.target.value; fb.volume=+e.target.value; };
if("mediaSession" in navigator){ navigator.mediaSession.metadata=new MediaMetadata({title:C.track.title,artist:C.handle});
  navigator.mediaSession.setActionHandler("play",start); navigator.mediaSession.setActionHandler("pause",stop); }

/* ---- Visualiser: stars + bars (bars fake-animate in fallback mode) ---- */
const cv=$("viz"),g=cv.getContext("2d"),stars=[...Array(70)].map(()=>[Math.random(),Math.random(),Math.random()]);
const data=new Uint8Array(128);
(function draw(ts){
  g.clearRect(0,0,cv.width,cv.height);
  stars.forEach(s=>{g.fillStyle=`rgba(255,255,255,${.3+.7*Math.abs(Math.sin(ts/900+s[2]*9))})`;g.fillRect(s[0]*cv.width,s[1]*cv.height,3,3)});
  if(playing){ if(analyser&&!useFallback) analyser.getByteFrequencyData(data); else for(let i=0;i<64;i++) data[i]=90+70*Math.sin(ts/300+i*.5)*Math.sin(ts/1100+i*.13);
    const n=48,w=cv.width/n; for(let i=0;i<n;i++){const v=data[i+2]/255,h=v*cv.height*.85; g.fillStyle=i%2?C.colors.pink:C.colors.green; g.fillRect(i*w+2,cv.height-h,w-4,h)} }
  else { g.fillStyle=C.colors.lightGreen; g.fillRect(0,cv.height-4,cv.width,4) }
  requestAnimationFrame(draw);
})(0);
render();
</script>
</body>
</html>
