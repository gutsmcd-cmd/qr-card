name: decode-audio
on:
  push:
    branches: [main]
    paths: ['audio-b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode mp3
        run: |
          set -e
          if [ ! -f audio-b64/done ]; then echo "waiting for all parts"; exit 0; fi
          cat audio-b64/part-* | base64 -d > space-lofi-loop.mp3
          echo "$(cat audio-b64/sha256)  space-lofi-loop.mp3" | sha256sum -c -
          git rm -r -q audio-b64
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add space-lofi-loop.mp3
          git commit -m "Add space lo-fi mp3 (decoded)"
          git push
